# TPU v5e-8 Distributed Accelerate Configuration
# Optimized for 8 TensorCore chips (128 GB HBM total) with native BF16 matrix acceleration

compute_environment: LOCAL_MACHINE
distributed_type: TPU
use_cpu: false
debug: false
mixed_precision: bf16
downcast_bf16: 'no'
tpu_use_cluster: false
tpu_use_sudo: false
tpu_env: []
num_machines: 1
num_processes: 8
main_process_port: 29500
rdzv_backend: static
same_network: true

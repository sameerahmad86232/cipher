name: koshur_noor
description: Offline prayer companion with Kashmiri dua meanings.
publish_to: none
version: 1.1.0+2
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  adhan_dart: ^2.0.1
  timezone: ^0.11.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/duas.json
    - assets/data/hadiths.json
    - assets/fonts/amiri-OFL.txt
    - assets/fonts/nastaliq-OFL.txt
    - assets/fonts/naskh-OFL.txt
  fonts:
    - family: Nastaliq
      fonts:
        - asset: assets/fonts/nastaliq.ttf
    - family: Arabic
      fonts:
        - asset: assets/fonts/amiri.ttf
    - family: NaskhFallback
      fonts:
        - asset: assets/fonts/naskh.ttf
